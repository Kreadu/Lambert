<style>
  html,body{height:100%}
  body{display:flex;flex-direction:column;overflow:hidden}
  .app{flex:1;display:flex;min-height:0}
  .side{width:360px;flex-shrink:0;overflow-y:auto;border-right:1px solid var(--border);background:var(--surface);padding:14px}
  .stage{flex:1;position:relative;min-width:0;background:var(--surface-muted)}
  .stage canvas{display:block;width:100%;height:100%;touch-action:none}
  @media (max-width:800px){
    .app{flex-direction:column-reverse}
    .side{width:100%;height:46vh;border-right:none;border-top:1px solid var(--border)}
    .stage{flex:none;height:calc(54vh - 54px)}
  }
  .side h3{font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:.04em;color:var(--text-tertiary);margin:16px 0 8px}
  .side h3:first-child{margin-top:0}
  .presets{display:grid;grid-template-columns:1fr 1fr;gap:6px}
  .preset{text-align:left;padding:8px 10px;border:1px solid var(--border);border-radius:var(--radius-md);background:var(--surface);cursor:pointer;font-size:13px}
  .preset b{display:block;font-weight:600}
  .preset.active{border-color:var(--text-primary);box-shadow:inset 0 0 0 1px var(--text-primary)}
  .dims{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
  .dims label{font-size:12px;color:var(--text-tertiary)}
  .prod-list{display:flex;flex-direction:column;gap:4px;max-height:260px;overflow-y:auto}
  .prod{display:flex;align-items:center;gap:8px;padding:6px 8px;border:1px solid var(--border);border-radius:var(--radius-md);background:var(--surface);cursor:pointer;text-align:left;font-size:13px}
  .prod:hover{border-color:var(--text-tertiary)}
  .prod .sw{width:22px;height:22px;border-radius:6px;border:1px solid var(--border);flex-shrink:0}
  .prod span{flex:1;min-width:0}
  .hud{position:absolute;left:12px;right:12px;bottom:12px;display:flex;gap:8px;flex-wrap:wrap;align-items:flex-end;pointer-events:none}
  .hud > *{pointer-events:auto}
  .sel{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:10px 12px;box-shadow:var(--shadow-md);max-width:min(520px,100%)}
  .sel .pills{margin-top:6px}
  .sel .pill{cursor:pointer;display:inline-flex;align-items:center;gap:6px}
  .sel .pill.active{border-color:var(--text-primary);font-weight:600}
  .hint{position:absolute;top:10px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.65);color:#fff;font-size:12px;padding:5px 12px;border-radius:999px;pointer-events:none;white-space:nowrap}
  .summary-row{display:flex;justify-content:space-between;gap:8px;font-size:13px;padding:5px 0;border-bottom:1px solid var(--border)}
  .summary-row span:last-child{font-variant-numeric:tabular-nums;white-space:nowrap}
  .total{display:flex;justify-content:space-between;font-weight:600;font-size:16px;padding-top:8px}
  select.input{padding:8px 10px}
  .loading{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--text-tertiary)}
</style>

<div class="app">

<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";
import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";
import { RoomEnvironment } from "three/addons/environments/RoomEnvironment.js";

const { C, configured, CATEGORIES, categoryLabel, unitLabel, money, esc, loadProducts, illustrate } = Lambert;
const $ = (id) => document.getElementById(id);
document.title = `${C.storeName} · Diseña tu baño`;
$("brand").textContent = C.storeName;

// ── Baños estándar (ver docs/PLAN.md) ──
const PRESETS = [
  { id: "medio", name: "Medio baño", note: "social, sin ducha", w: 1.2, l: 1.5 },
  { id: "pequeno", name: "Pequeño", note: "1,50 × 2,00", w: 1.5, l: 2.0 },
  { id: "estandar", name: "Estándar", note: "1,80 × 2,40", w: 1.8, l: 2.4 },
  { id: "principal", name: "Principal", note: "2,50 × 3,00", w: 2.5, l: 3.0 },
];
// Medidas por defecto (cm) si el producto no las tiene, y altura de montaje en pared (centro, m)
const DEFAULT_DIMS = { sanitarios: [38, 76, 68], lavamanos: [55, 18, 45], griferia: [6, 16, 14], duchas: [22, 4, 22],
  divisiones: [120, 190, 4], tinas: [150, 50, 70], muebles: [60, 50, 46], espejos: [60, 80, 3], accesorios: [40, 6, 8] };
const WALL_HEIGHT = { lavamanos: 0.8, griferia: 1.0, duchas: 2.05, espejos: 1.55, accesorios: 1.1, muebles: 0.6, sanitarios: 0.25 };
const DOOR = { w: 0.8, h: 2.05 };

// ── Estado (se guarda en este navegador) ──
const saved = (() => { try { return JSON.parse(localStorage.getItem("lambert_diseno") || "null"); } catch { return null; } })();
const state = saved?.room ? saved : {
  room: { w: 1.8, l: 2.4, h: 2.4, preset: "estandar", doorWall: "front", doorPos: 0.75 },
  floor: null, wall: null,         // { productId, variantId }
  items: [],                       // { uid, productId, variantId, x, y, z, rot, wall }
};
function persist() {
  try { localStorage.setItem("lambert_diseno", JSON.stringify(state)); } catch { /* sin almacenamiento: solo esta sesión */ }
}

let products = [];
const byId = (id) => products.find((p) => p.id === id);
const variantOf = (p, vid) => p?.variants.find((v) => v.id === vid) || p?.inStock[0] || p?.variants[0] || null;
const hexOf = (v, fallback = "#e8e8e6") => (v?.color_hex && /^#[0-9a-f]{6}$/i.test(v.color_hex) ? v.color_hex : fallback);

// ── Escena ──
const stage = $("stage");
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true }); // permite capturar o descargar la imagen
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping; // evita blancos "quemados" con el ambiente de luz
renderer.toneMappingExposure = 0.9;
stage.prepend(renderer.domElement);
const scene = new THREE.Scene();
scene.background = new THREE.Color(getComputedStyle(document.body).getPropertyValue("--surface-muted").trim() || "#f5f5f5");
// ambiente de luz para que metales y espejos tengan qué reflejar
scene.environment = new THREE.PMREMGenerator(renderer).fromScene(new RoomEnvironment(), 0.04).texture;
const camera = new THREE.PerspectiveCamera(50, 1, 0.05, 100);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.maxPolarAngle = Math.PI * 0.49;
controls.minDistance = 1;
controls.maxDistance = 12;
scene.add(new THREE.HemisphereLight(0xffffff, 0xd8d2c8, 0.9));
const sun = new THREE.DirectionalLight(0xffffff, 1.4);
sun.intensity = 1.0;
sun.position.set(2, 5, 3);
sun.castShadow = true;
sun.shadow.mapSize.set(1024, 1024);
scene.add(sun);

const roomGroup = new THREE.Group();
const itemsGroup = new THREE.Group();
scene.add(roomGroup, itemsGroup);
let walls = [];   // { mesh, side, normal, along, length }

function resize() {
  const { clientWidth: w, clientHeight: h } = stage;
  renderer.setSize(w, h, false);
  camera.aspect = w / Math.max(h, 1);
  camera.updateProjectionMatrix();
}
new ResizeObserver(resize).observe(stage);

// ── Cerámica: textura a escala real (foto de la pieza o color con junta) ──
const texCache = new Map();
function tileTexture(product, variant) {
  const key = `${product?.id}:${variant?.id}`;
  if (texCache.has(key)) return texCache.get(key);
  const canvas = document.createElement("canvas");
  const tw = product?.tile_width_cm || 60, th = product?.tile_height_cm || 60;
  // subway y tablón de madera van trabados (cada fila corrida media pieza): la textura lleva 2 filas
  const staggered = /subway|madera/i.test(product?.name || "");
  canvas.width = 256;
  canvas.height = Math.round(256 * th / tw) * (staggered ? 2 : 1);
  const ctx = canvas.getContext("2d");
  const grout = Math.max(2, Math.round(canvas.width * 0.25 / tw)); // ≈ 2,5 mm
  const paint = (img) => {
    ctx.fillStyle = "#cfcac2";
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    const rowH = staggered ? canvas.height / 2 : canvas.height;
    const piece = (x, y) => {
      if (img) ctx.drawImage(img, x + grout / 2, y + grout / 2, canvas.width - grout, rowH - grout);
      else { ctx.fillStyle = hexOf(variant, "#efefec"); ctx.fillRect(x + grout / 2, y + grout / 2, canvas.width - grout, rowH - grout); }
    };
    piece(0, 0);
    if (staggered) { piece(-canvas.width / 2, rowH); piece(canvas.width / 2, rowH); }
    tex.needsUpdate = true;
    tex.userData.clones?.forEach((c) => (c.needsUpdate = true)); // las copias con su repetición también
  };
  const tex = new THREE.CanvasTexture(canvas);
  tex.colorSpace = THREE.SRGBColorSpace;
  tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
  tex.userData = { tw: tw / 100, th: (th * (staggered ? 2 : 1)) / 100, clones: [] };
  paint(null);
  if (variant?.texture) {
    const img = new Image();
    img.crossOrigin = "anonymous";
    img.onload = () => paint(img);
    img.src = variant.texture;
  }
  texCache.set(key, tex);
  return tex;
}
function surfaceMaterial(sel, w, h, fallback) {
  const p = sel && byId(sel.productId);
  if (!p) return new THREE.MeshStandardMaterial({ color: fallback, roughness: 0.9 });
  const base = tileTexture(p, variantOf(p, sel.variantId));
  const tex = base.clone();
  tex.userData = {};
  tex.needsUpdate = true;
  base.userData.clones.push(tex);
  tex.repeat.set(w / base.userData.tw, h / base.userData.th);
  return new THREE.MeshStandardMaterial({ map: tex, roughness: 0.55, envMapIntensity: 0.5 });
}

// ── Habitación ──
function buildRoom() {
  texCache.forEach((t) => (t.userData.clones.length = 0));
  roomGroup.clear();
  walls = [];
  const { w, l, h } = state.room;
  const floor = new THREE.Mesh(new THREE.PlaneGeometry(w, l), surfaceMaterial(state.floor, w, l, "#e9e6e0"));
  floor.rotation.x = -Math.PI / 2;
  floor.receiveShadow = true;
  floor.userData.isFloor = true;
  roomGroup.add(floor);

  // pared: centro, normal hacia adentro, eje "along" para moverse sobre ella
  const defs = [
    { side: "back", len: w, pos: [0, h / 2, -l / 2], rotY: 0, normal: [0, 0, 1], along: [1, 0, 0] },
    { side: "front", len: w, pos: [0, h / 2, l / 2], rotY: Math.PI, normal: [0, 0, -1], along: [-1, 0, 0] },
    { side: "left", len: l, pos: [-w / 2, h / 2, 0], rotY: Math.PI / 2, normal: [1, 0, 0], along: [0, 0, 1] },
    { side: "right", len: l, pos: [w / 2, h / 2, 0], rotY: -Math.PI / 2, normal: [-1, 0, 0], along: [0, 0, -1] },
  ];
  for (const d of defs) {
    const mesh = new THREE.Mesh(new THREE.PlaneGeometry(d.len, h), surfaceMaterial(state.wall, d.len, h, "#f3f1ec"));
    mesh.position.set(...d.pos);
    mesh.rotation.y = d.rotY;
    mesh.receiveShadow = true;
    mesh.userData.wall = d.side;
    roomGroup.add(mesh);
    const wall = { ...d, mesh, normal: new THREE.Vector3(...d.normal), along: new THREE.Vector3(...d.along), extra: [] };
    if (d.side === state.room.doorWall) {
      const door = new THREE.Mesh(new THREE.PlaneGeometry(DOOR.w, DOOR.h), new THREE.MeshStandardMaterial({ color: "#9a7b5a", roughness: 0.7 }));
      const off = (state.room.doorPos - 0.5) * Math.max(0, d.len - DOOR.w - 0.1);
      door.position.copy(mesh.position).addScaledVector(wall.along, off).add(wall.normal.clone().multiplyScalar(0.005));
      door.position.y = DOOR.h / 2;
      door.rotation.y = d.rotY;
      roomGroup.add(door);
      wall.extra.push(door);
    }
    // zócalo de contorno para que se lea la esquina
    const edge = new THREE.Mesh(new THREE.BoxGeometry(d.len, 0.01, 0.01), new THREE.MeshBasicMaterial({ color: "#b9b4ab" }));
    edge.position.set(d.pos[0], 0.005, d.pos[2]);
    edge.rotation.y = d.rotY;
    roomGroup.add(edge);
    wall.extra.push(edge);
    walls.push(wall);
  }
  controls.target.set(0, 0.9, 0);
}

// Vista "casa de muñecas": se ocultan las paredes que quedan entre la cámara y el baño
function updateWallVisibility() {
  for (const wl of walls) {
    const toCam = camera.position.clone().sub(wl.mesh.position);
    const visible = toCam.dot(wl.normal) > 0;
    wl.mesh.visible = visible;
    wl.extra.forEach((e) => (e.visible = visible));
    for (const obj of itemsGroup.children) if (obj.userData.item.wall === wl.side) obj.visible = visible;
  }
}

// ── Productos en 3D ──
const loader = new GLTFLoader();
const modelCache = new Map();
function loadModel(url) {
  if (!modelCache.has(url)) modelCache.set(url, loader.loadAsync(url).then((g) => g.scene));
  return modelCache.get(url);
}
function dimsOf(p) {
  const d = DEFAULT_DIMS[p.category] || [40, 40, 40];
  return [(p.width_cm || d[0]) / 100, (p.height_cm || d[1]) / 100, (p.depth_cm || d[2]) / 100];
}
function mat(color, opts = {}) {
  return new THREE.MeshStandardMaterial({ color, roughness: 0.35, metalness: 0, ...opts });
}

// Forma aproximada cuando el producto aún no tiene modelo 3D (a escala con sus medidas)
function proxy(p, color) {
  const [w, h, d] = dimsOf(p);
  const g = new THREE.Group();
  const add = (geo, m, x, y, z) => { const o = new THREE.Mesh(geo, m); o.position.set(x, y, z); o.castShadow = true; g.add(o); return o; };
  const ceramic = mat(color, { roughness: 0.15 });
  const metal = mat(color, { metalness: 0.9, roughness: 0.25 });
  const sub = (p.subcategory || "").toLowerCase();
  switch (p.category) {
    case "sanitarios": {
      if (sub.includes("orinal")) { add(new THREE.BoxGeometry(w, h, d), ceramic, 0, h / 2, 0); break; }
      const bowlH = sub.includes("suspendido") ? h : Math.min(0.42, h);
      add(new THREE.CylinderGeometry(w * 0.48, w * 0.36, bowlH, 24).scale(1, 1, (d * 0.7) / w), ceramic, 0, bowlH / 2, d * 0.12);
      if (!sub.includes("suspendido") && !sub.includes("bidé")) add(new THREE.BoxGeometry(w, Math.max(0.05, h - bowlH), d * 0.28), ceramic, 0, bowlH + (h - bowlH) / 2, -d / 2 + d * 0.14);
      break;
    }
    case "lavamanos": {
      const top = Math.min(h, 0.2);
      add(new THREE.BoxGeometry(w, top, d), ceramic, 0, h - top / 2, 0);
      add(new THREE.BoxGeometry(w * 0.8, 0.02, d * 0.7), mat("#d9dde0", { roughness: 0.1 }), 0, h + 0.001, 0);
      if (sub.includes("pedestal") && h > top) add(new THREE.CylinderGeometry(w * 0.14, w * 0.18, h - top, 20), ceramic, 0, (h - top) / 2, -d * 0.1);
      break;
    }
    case "muebles": {
      add(new THREE.BoxGeometry(w, h, d), mat(color, { roughness: 0.6 }), 0, h / 2, 0);
      if (sub.includes("lavamanos")) add(new THREE.BoxGeometry(w * 0.9, 0.03, d * 0.9), mat("#f7f7f5", { roughness: 0.15 }), 0, h + 0.015, 0);
      break;
    }
    case "espejos": {
      const shape = sub.includes("redondo") || /redondo/i.test(p.name) ? new THREE.CylinderGeometry(w / 2, w / 2, d, 40).rotateX(Math.PI / 2) : new THREE.BoxGeometry(w, h, d);
      add(shape, mat(color, { roughness: 0.4 }), 0, h / 2, 0);
      const glass = shape.clone().scale(0.92, 0.92, 1.05);
      add(glass, mat("#dfe7ea", { metalness: 0.85, roughness: 0.04, envMapIntensity: 1.4 }), 0, h / 2, 0.002);
      break;
    }
    case "duchas": {
      add(new THREE.CylinderGeometry(w / 2, w / 2, Math.max(h, 0.02), 32), metal, 0, h / 2, d / 2);
      add(new THREE.CylinderGeometry(0.012, 0.012, 0.35, 12).rotateX(Math.PI / 2), metal, 0, h, -0.1);
      break;
    }
    case "griferia": {
      add(new THREE.CylinderGeometry(w / 2, w / 2, h, 20), metal, 0, h / 2, 0);
      add(new THREE.BoxGeometry(w * 0.6, w * 0.6, d), metal, 0, h * 0.85, d / 2);
      break;
    }
    case "divisiones": {
      add(new THREE.BoxGeometry(w, h, Math.max(d, 0.01)), new THREE.MeshPhysicalMaterial({ color, transmission: 0.85, transparent: true, opacity: 0.35, roughness: 0.05 }), 0, h / 2, 0);
      add(new THREE.BoxGeometry(w, 0.03, 0.04), mat("#b8bcbf", { metalness: 0.9, roughness: 0.3 }), 0, h, 0);
      break;
    }
    case "tinas": {
      add(new THREE.BoxGeometry(w, h, d), ceramic, 0, h / 2, 0);
      if (h > 0.1) add(new THREE.BoxGeometry(w * 0.88, 0.01, d * 0.8), mat("#dce3e6", { roughness: 0.1 }), 0, h + 0.002, 0);
      break;
    }
    default:
      add(new THREE.BoxGeometry(w, h, d), p.category === "accesorios" ? metal : ceramic, 0, h / 2, 0);
  }
  return g;
}

async function buildItem(item) {
  const p = byId(item.productId);
  if (!p) return null;
  const v = variantOf(p, item.variantId);
  const color = hexOf(v);
  let obj;
  if (p.model) {
    try {
      const src = (await loadModel(p.model)).clone(true);
      // escalar el modelo a las medidas del producto y apoyarlo en y = 0
      const box = new THREE.Box3().setFromObject(src);
      const size = box.getSize(new THREE.Vector3());
      const [w, h, d] = dimsOf(p);
      src.scale.set(w / (size.x || 1), h / (size.y || 1), d / (size.z || 1));
      const box2 = new THREE.Box3().setFromObject(src);
      const center = box2.getCenter(new THREE.Vector3());
      src.position.sub(new THREE.Vector3(center.x, box2.min.y, center.z));
      src.traverse((o) => {
        if (!o.isMesh) return;
        o.castShadow = true;
        o.material = o.material.clone();
        if (v?.color_hex && o.material.color) o.material.color.set(color);
      });
      obj = new THREE.Group();
      obj.add(src);
    } catch { obj = proxy(p, color); }
  } else obj = proxy(p, color);
  obj.userData.item = item;
  return obj;
}

function placeObject(obj) {
  const it = obj.userData.item;
  const p = byId(it.productId);
  const [, h, d] = dimsOf(p);
  if (it.wall) {
    const wl = walls.find((x) => x.side === it.wall);
    if (!wl) return;
    const half = wl.len / 2;
    const [w] = dimsOf(p);
    it.x = THREE.MathUtils.clamp(it.x, -half + w / 2, half - w / 2);
    it.y = THREE.MathUtils.clamp(it.y, 0, state.room.h - h);
    obj.position.copy(wl.mesh.position).addScaledVector(wl.along, it.x).addScaledVector(wl.normal, d / 2 + 0.002);
    obj.position.y = it.y;
    obj.rotation.set(0, wl.rotY, 0);
  } else {
    const [w] = dimsOf(p);
    const rotated = Math.round(it.rot / (Math.PI / 2)) % 2 !== 0;
    const ex = (rotated ? d : w) / 2, ez = (rotated ? w : d) / 2;
    it.x = THREE.MathUtils.clamp(it.x, -state.room.w / 2 + ex, state.room.w / 2 - ex);
    it.z = THREE.MathUtils.clamp(it.z, -state.room.l / 2 + ez, state.room.l / 2 - ez);
    obj.position.set(it.x, 0, it.z);
    obj.rotation.set(0, it.rot, 0);
  }
}

async function rebuildItems() {
  itemsGroup.clear();
  for (const it of state.items) {
    const obj = await buildItem(it);
    if (!obj) continue;
    itemsGroup.add(obj);
    placeObject(obj);
  }
  if (selected) selected = itemsGroup.children.find((o) => o.userData.item.uid === selected.userData.item.uid) || null;
  updateSelectionBox();
}

// ── Agregar, seleccionar, arrastrar ──
let selected = null;
const selBox = new THREE.BoxHelper(undefined, 0x2563eb);
selBox.visible = false;
scene.add(selBox);
function updateSelectionBox() {
  if (selected) { selBox.setFromObject(selected); selBox.visible = true; } else selBox.visible = false;
}

async function addProduct(p, variantId) {
  const v = variantId ? p.variants.find((x) => x.id === variantId) : p.inStock[0];
  const item = { uid: crypto.randomUUID(), productId: p.id, variantId: v?.id ?? null, x: 0, y: 0, z: 0, rot: 0, wall: null };
  if (p.placement === "wall") {
    // la pared visible más lejana a la cámara (la que se ve de frente), a la altura típica de montaje
    const vis = walls.filter((w) => w.mesh.visible);
    const wl = (vis.length ? vis : walls).sort((a, b) => a.mesh.position.distanceTo(camera.position) - b.mesh.position.distanceTo(camera.position)).at(-1);
    item.wall = wl.side;
    const [, h] = dimsOf(p);
    item.y = Math.max(0, (WALL_HEIGHT[p.category] ?? 1.0) - h / 2);
  }
  state.items.push(item);
  const obj = await buildItem(item);
  itemsGroup.add(obj);
  placeObject(obj);
  select(obj);
  persist();
  renderSummary();
  flash(p.placement === "wall" ? "Arrástralo por la pared" : "Arrástralo por el piso");
}

function select(obj) {
  selected = obj;
  updateSelectionBox();
  renderSelection();
}

const ray = new THREE.Raycaster();
const ptr = new THREE.Vector2();
let drag = null;   // { obj, plane, offset }
function setPtr(e) {
  const r = renderer.domElement.getBoundingClientRect();
  ptr.set(((e.clientX - r.left) / r.width) * 2 - 1, -((e.clientY - r.top) / r.height) * 2 + 1);
  ray.setFromCamera(ptr, camera);
}
function hitItem() {
  const hits = ray.intersectObjects(itemsGroup.children.filter((o) => o.visible), true);
  if (!hits.length) return null;
  let o = hits[0].object;
  while (o.parent && o.parent !== itemsGroup) o = o.parent;
  return o;
}
let downAt = null;
renderer.domElement.addEventListener("pointerdown", (e) => {
  setPtr(e);
  downAt = { x: e.clientX, y: e.clientY };
  const obj = hitItem();
  if (!obj) return; // vacío: OrbitControls gira la cámara; deselecciona al soltar si no hubo arrastre
  select(obj);
  const it = obj.userData.item;
  const plane = it.wall
    ? new THREE.Plane().setFromNormalAndCoplanarPoint(walls.find((w) => w.side === it.wall).normal, obj.position)
    : new THREE.Plane(new THREE.Vector3(0, 1, 0), 0);
  const hit = ray.ray.intersectPlane(plane, new THREE.Vector3());
  if (!hit) return;
  drag = { obj, plane, offset: obj.position.clone().sub(hit) };
  controls.enabled = false;
  renderer.domElement.setPointerCapture(e.pointerId);
});
renderer.domElement.addEventListener("pointermove", (e) => {
  if (!drag) return;
  setPtr(e);
  const hit = ray.ray.intersectPlane(drag.plane, new THREE.Vector3());
  if (!hit) return;
  const pos = hit.add(drag.offset);
  const it = drag.obj.userData.item;
  if (it.wall) {
    const wl = walls.find((w) => w.side === it.wall);
    it.x = pos.clone().sub(wl.mesh.position).dot(wl.along);
    it.y = pos.y;
  } else { it.x = pos.x; it.z = pos.z; }
  placeObject(drag.obj);
  updateSelectionBox();
});
const endDrag = (e) => {
  if (drag) { drag = null; controls.enabled = true; persist(); return; }
  if (downAt && e && Math.hypot(e.clientX - downAt.x, e.clientY - downAt.y) < 5) select(null);
  downAt = null;
};
renderer.domElement.addEventListener("pointerup", endDrag);
renderer.domElement.addEventListener("pointercancel", endDrag);

// ── Panel del producto seleccionado ──
function renderSelection() {
  const box = $("sel");
  if (!selected) { box.hidden = true; return; }
  const it = selected.userData.item;
  const p = byId(it.productId);
  const v = variantOf(p, it.variantId);
  const opts = p.variants.filter((x) => x.active);
  box.hidden = false;
  box.innerHTML = `
    <div class="row" style="justify-content:space-between">
      <div style="min-width:0"><div style="font-weight:600">${esc(p.name)}</div>
        <div class="muted">${esc(v?.name || "")} · ${money.format(v?.finalPrice ?? p.price)}</div></div>
      <div class="row">
        ${it.wall ? `<select class="input" id="selWall" style="width:auto">${walls.map((w) => `<option value="${w.side}" ${w.side === it.wall ? "selected" : ""}>${{ back: "Fondo", front: "Frente", left: "Izquierda", right: "Derecha" }[w.side]}</option>`).join("")}</select>`
          : `<button class="icon-btn" id="selRot" title="Girar 90°" aria-label="Girar 90°">⟳</button>`}
        <button class="icon-btn" id="selDel" title="Quitar" aria-label="Quitar del diseño">🗑</button>
      </div>
    </div>
    ${opts.length > 1 ? `<div class="pills">${opts.map((x) => {
      const out = x.stock <= 0;
      return `<button class="pill ${x.id === v?.id ? "active" : ""}" data-v="${x.id}" ${out ? "disabled style='opacity:.4;cursor:not-allowed' title='Agotado'" : ""}>
        <span class="swatch" style="background:${hexOf(x)};width:14px;height:14px"></span>${esc(x.name)}${out ? " · agotado" : ""}</button>`;
    }).join("")}</div>` : ""}`;
  box.onclick = async (e) => {
    if (e.target.closest("#selDel")) {
      state.items = state.items.filter((x) => x.uid !== it.uid);
      itemsGroup.remove(selected);
      select(null);
      persist(); renderSummary();
    } else if (e.target.closest("#selRot")) {
      it.rot = (it.rot + Math.PI / 2) % (Math.PI * 2);
      placeObject(selected); updateSelectionBox(); persist();
    } else {
      const b = e.target.closest("[data-v]");
      if (!b || b.disabled) return;
      it.variantId = b.dataset.v;
      persist(); renderSummary();
      await rebuildItems();
      renderSelection();
    }
  };
  $("selWall")?.addEventListener("change", (e) => {
    it.wall = e.target.value; it.x = 0;
    placeObject(selected); updateSelectionBox(); updateWallVisibility(); persist();
  });
}

// ── Panel lateral ──
function renderRoomForm() {
  $("presets").innerHTML = PRESETS.map((p) => `<button class="preset ${state.room.preset === p.id ? "active" : ""}" data-preset="${p.id}"><b>${p.name}</b><span class="muted">${p.note}</span></button>`).join("");
  $("rw").value = state.room.w; $("rl").value = state.room.l; $("rh").value = state.room.h;
  $("doorWall").value = state.room.doorWall; $("doorPos").value = state.room.doorPos;
}
function roomChanged() {
  buildRoom();
  itemsGroup.children.forEach(placeObject);
  updateSelectionBox();
  frameCamera();
  persist(); renderSummary();
}
$("presets").addEventListener("click", (e) => {
  const b = e.target.closest("[data-preset]");
  if (!b) return;
  const p = PRESETS.find((x) => x.id === b.dataset.preset);
  Object.assign(state.room, { w: p.w, l: p.l, preset: p.id });
  renderRoomForm(); roomChanged();
});
for (const id of ["rw", "rl", "rh"]) $(id).addEventListener("change", () => {
  const val = (x, lo, hi) => THREE.MathUtils.clamp(Number(x) || lo, lo, hi);
  Object.assign(state.room, { w: val($("rw").value, 0.8, 8), l: val($("rl").value, 0.8, 8), h: val($("rh").value, 2, 4), preset: null });
  renderRoomForm(); roomChanged();
});
$("doorWall").addEventListener("change", (e) => { state.room.doorWall = e.target.value; roomChanged(); });
$("doorPos").addEventListener("input", (e) => { state.room.doorPos = Number(e.target.value); buildRoom(); updateWallVisibility(); persist(); });

function tileOptions(use) {
  const tiles = products.filter((p) => p.placement === "surface" && p.unit === "m2" && (p.surface_use === "both" || p.surface_use === use));
  return `<option value="">Sin cerámica</option>` + tiles.map((p) =>
    `<optgroup label="${esc(p.name)}">${p.variants.filter((v) => v.active).map((v) =>
      `<option value="${p.id}|${v.id}" ${v.stock <= 0 ? "disabled" : ""}>${esc(v.name)}${v.stock <= 0 ? " (agotado)" : ""} · ${money.format(v.finalPrice)}/m²</option>`).join("")}</optgroup>`).join("");
}
function renderTileSelects() {
  $("floorTile").innerHTML = tileOptions("floor");
  $("wallTile").innerHTML = tileOptions("wall");
  $("floorTile").value = state.floor ? `${state.floor.productId}|${state.floor.variantId}` : "";
  $("wallTile").value = state.wall ? `${state.wall.productId}|${state.wall.variantId}` : "";
}
for (const [id, key] of [["floorTile", "floor"], ["wallTile", "wall"]]) $(id).addEventListener("change", (e) => {
  const [productId, variantId] = e.target.value.split("|");
  state[key] = productId ? { productId, variantId } : null;
  buildRoom(); updateWallVisibility(); persist(); renderSummary();
});

let cat = "sanitarios";
function renderProducts() {
  const placeable = CATEGORIES.filter((c) => c.placement !== "surface" && c.placement !== "none" &&
    products.some((p) => p.category === c.slug && p.placement !== "none" && p.available));
  if (!placeable.some((c) => c.slug === cat)) cat = placeable[0]?.slug;
  $("cats").innerHTML = placeable.map((c) => `<option value="${esc(c.slug)}">${esc(c.label)}</option>`).join("");
  $("cats").value = cat;
  const list = products.filter((p) => p.category === cat && p.placement !== "none" && p.available);
  $("prods").innerHTML = list.map((p) => `<button class="prod" data-add="${p.id}">
    <img class="sw" src="${esc(p.photos[0] || illustrate(p, p.inStock[0]))}" alt="" style="width:40px;height:40px;object-fit:cover">
    <span><span style="display:block">${esc(p.name)}</span><span class="muted">${esc(p.subcategory)} · desde ${money.format(p.fromPrice)}</span></span>
    <b>+</b></button>`).join("") || `<span class="muted">No hay productos con stock en esta categoría.</span>`;
}
$("cats").addEventListener("change", (e) => { cat = e.target.value; renderProducts(); });
$("prods").addEventListener("click", (e) => {
  const b = e.target.closest("[data-add]");
  if (b) addProduct(byId(b.dataset.add));
});

function renderSummary() {
  const { w, l, h } = state.room;
  const rows = [];
  let total = 0;
  const tileRow = (sel, area, label) => {
    const p = sel && byId(sel.productId);
    if (!p) return;
    const v = variantOf(p, sel.variantId);
    const m2 = Math.ceil(area * 1.1 * 100) / 100;
    const sub = m2 * (v?.finalPrice ?? p.price);
    total += sub;
    rows.push([`${label}: ${p.name} · ${v?.name ?? ""} (${m2.toLocaleString(C.locale)} m²)`, sub]);
  };
  tileRow(state.floor, w * l, "Piso");
  tileRow(state.wall, 2 * (w + l) * h - DOOR.w * DOOR.h, "Paredes");
  const grouped = new Map();
  for (const it of state.items) {
    const key = `${it.productId}|${it.variantId}`;
    grouped.set(key, (grouped.get(key) || 0) + 1);
  }
  for (const [key, qty] of grouped) {
    const [pid, vid] = key.split("|");
    const p = byId(pid);
    if (!p) continue;
    const v = variantOf(p, vid);
    const sub = qty * (v?.finalPrice ?? p.price);
    total += sub;
    rows.push([`${qty > 1 ? qty + " × " : ""}${p.name}${v ? " · " + v.name : ""}`, sub]);
  }
  $("summary").innerHTML = rows.length
    ? rows.map(([t, s]) => `<div class="summary-row"><span>${esc(t)}</span><span>${money.format(s)}</span></div>`).join("") +
      `<div class="total"><span>Total</span><span>${money.format(total)}</span></div>`
    : `<p class="muted">Elige la cerámica y agrega productos para ver el total.</p>`;
}

// ── Cámara y bucle ──
function frameCamera() {
  const { w, l } = state.room;
  const r = Math.max(w, l);
  camera.position.set(r * 0.9, r * 1.25 + 1, r * 1.35 + 0.8);
  controls.update();
}
let hintTimer;
function flash(msg) {
  const h = $("hint");
  h.textContent = msg; h.hidden = false;
  clearTimeout(hintTimer);
  hintTimer = setTimeout(() => (h.hidden = true), 2500);
}
renderer.setAnimationLoop(() => {
  controls.update();
  updateWallVisibility();
  if (selected && drag) updateSelectionBox();
  renderer.render(scene, camera);
});

// ── Inicio ──
async function init() {
  resize();
  renderRoomForm();
  buildRoom();
  frameCamera();
  if (!configured) { $("loading").textContent = "Falta conectar Supabase (config.js)."; return; }
  try { products = await loadProducts(); }
  catch (e) { console.error(e); $("loading").textContent = "No se pudo cargar el catálogo."; return; }
  $("loading").remove();
  // limpiar del diseño guardado lo que ya no existe
  state.items = state.items.filter((it) => byId(it.productId));
  if (state.floor && !byId(state.floor.productId)) state.floor = null;
  if (state.wall && !byId(state.wall.productId)) state.wall = null;
  renderTileSelects();
  renderProducts();
  buildRoom();
  await rebuildItems();
  renderSummary();
  // desde el catálogo: disenar.html?add=<producto>&v=<variante>
  const qs = new URLSearchParams(location.search);
  const toAdd = qs.get("add") && byId(qs.get("add"));
  if (toAdd) {
    history.replaceState(null, "", location.pathname);
    if (toAdd.placement === "surface") {
      const vid = qs.get("v") || toAdd.inStock[0]?.id;
      const key = toAdd.surface_use === "wall" ? "wall" : "floor";
      state[key] = { productId: toAdd.id, variantId: vid };
      renderTileSelects(); buildRoom(); persist(); renderSummary();
    } else if (toAdd.placement !== "none") {
      cat = toAdd.category; renderProducts();
      await addProduct(toAdd, qs.get("v"));
    }
  }
  if (!state.items.length && !toAdd) flash("Elige tu baño, la cerámica y agrega productos");
  // primer cuadro de inmediato (sin esperar al bucle de animación)
  controls.update(); updateWallVisibility(); renderer.render(scene, camera);
}
init();
</script>
</body>
